const AI = {
  fn: null, ok: false, busy: {}, ctl: {}, out: { plan: '', planDate: null, week: '' }, why: {},
  async init() {
    try { this.fn = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { this.fn = null; }
    this.ok = typeof this.fn === 'function'; scheduleRender();
  },
  fail(e, key) {
    const c = e && e.code;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { this.ok = false; scheduleRender(); toast('Claude suggestions are off for this page.'); return; }
    if (c === 'cancelled') return;
    if (c === 'rate_limited') { toast('Claude is busy for you right now. Try again in a minute.', { kind: 'warn' }); return; }
    if (c === 'refused') { if (key === 'plan') this.out.plan = ''; toast('Claude declined that request.', { kind: 'warn' }); return; }
    if (c === 'session_expired') { toast('Sign in to Claude again to use suggestions.', { kind: 'warn' }); return; }
    toast('Claude couldn’t answer just now. Try again.', { kind: 'warn' });
  },
  taskLine(t) {
    const di = dueInfo(t); const a = areaById(t.area);
    return `- [${t.id}] ${t.title}${a ? ' (' + a.name + ')' : ''}${t.pri ? ', priority ' + PRI_LABEL[t.pri].toLowerCase() : ''}${t.important ? ', flagged important' : ''}${di ? ', due ' + di.label.toLowerCase() : ', no due date'}${t.time ? ' at ' + fmtTime(t.time) : ''}${t.est ? ', needs about ' + fmtMins(t.est) : ''}${t.goal && goalById(t.goal) ? ', toward goal "' + goalById(t.goal).title + '"' : ''}`;
  },
  dayContext() {
    const tk = todayKey(); const s = settings(); const classDay = (s.classDays || []).includes(dow(tk));
    const evs = eventsOn(tk).map(e => `- ${e.start ? fmtTime(e.start) + (e.end ? '–' + fmtTime(e.end) : '') : 'All day'}: ${e.title}${areaById(e.area) ? ' (' + areaById(e.area).name + ')' : ''}`);
    const open = tasks().filter(t => !isDone(t));
    const relevant = open.filter(t => (t.due && t.due <= addDays(tk, 2)) || t.focus === tk || t.status === 'doing').sort(smartSort).slice(0, 30);
    const habs = activeHabits().filter(h => scheduledOn(h, tk) && !habitDone(h.id, tk)).map(h => '- ' + h.name);
    return { tk, classDay, evs, relevant, habs };
  },
  async plan() {
    if (!this.ok || this.busy.plan) return;
    const c = this.dayContext();
    const prompt = `You are helping ${settings().name || 'the user'}, who runs a tuition centre (PSLE and lower secondary), a trading-card business and corporate AI training sessions in Singapore, plan the rest of today.
It is ${fmtLong(c.tk)}, ${fmtTime(nowHM())} local time. ${c.classDay ? 'Today is a tuition class day.' : 'There are no tuition classes today.'}
Fixed events today:
${c.evs.join('\n') || '- none'}
Open tasks (overdue, due soon, starred or in progress):
${c.relevant.map(t => this.taskLine(t).replace(/\[[^\]]+\]\s/, '')).join('\n') || '- none'}
Habits still to do today:
${c.habs.join('\n') || '- none'}

Draft a realistic time-blocked plan from now until about 10:30pm. Keep fixed events exactly where they are. Put the most important work in the earliest open blocks, keep a meal and two short breaks, and do not overfill: anything that won't fit goes in a "Move to tomorrow" line.
Format: plain text only, no markdown, no bullets. One block per line as "HH:MM–HH:MM  activity" using 24-hour times. Then optionally one line starting "Move to tomorrow:". Then one line starting "Tip:" with one short, specific suggestion. At most 15 lines in total.`;
    this.busy.plan = true; this.out.plan = ''; this.out.planDate = c.tk; this.ctl.plan = new AbortController(); render();
    try {
      await this.fn(prompt, { signal: this.ctl.plan.signal, cache: false, onText: ({ text }) => { this.out.plan = text; const el = $('#ai-plan'); if (el) el.textContent = text; } });
    } catch (e) { if (e && e.text) this.out.plan = e.text; this.fail(e, 'plan'); }
    finally { this.busy.plan = false; scheduleRender(); }
  },
  async top3() {
    if (!this.ok || this.busy.top3) return;
    const c = this.dayContext(); const pinned = pinnedToday();
    const slots = 3 - pinned.length; if (slots <= 0) { toast('Your top 3 is already full.'); return; }
    const pool = tasks().filter(t => !isDone(t) && t.focus !== c.tk).sort(smartSort).slice(0, 40);
    if (!pool.length) { toast('No open tasks to choose from.'); return; }
    const prompt = `Pick the ${slots} task${slots > 1 ? 's' : ''} that matter most for today, ${fmtLong(c.tk)}. Weigh deadlines, priority, importance and how they move goals forward. ${c.classDay ? 'It is a tuition class day, so time is tighter.' : ''}
${pinned.length ? 'Already chosen: ' + pinned.map(t => t.title).join('; ') + '.\n' : ''}Today's fixed events: ${c.evs.join(' ') || 'none'}.
Candidates (the id is in square brackets):
${pool.map(t => this.taskLine(t)).join('\n')}

Reply with only a JSON array of up to ${slots} objects like [{"id":"t123","why":"Due today and unblocks Friday's class"}]. "why" must be under 12 words.`;
    this.busy.top3 = true; render();
    try {
      const res = await this.fn.json(prompt, { modelTier: 'quick', cache: false });
      const picks = Array.isArray(res) ? res : [];
      let added = 0;
      picks.forEach(p => {
        const t = p && taskById(String(p.id));
        if (t && !isDone(t) && t.focus !== c.tk && pinnedToday().length < 3) { t.focus = c.tk; t.focusOrder = Date.now() + added; this.why[t.id] = String(p.why || '').slice(0, 90); added++; }
      });
      if (added) { Store.save('tasks'); toast(`Claude starred ${plural(added, 'task')} for today`, { action: 'Undo', onAction: () => { picks.forEach(p => { const t = taskById(String(p.id)); if (t && t.focus === c.tk) t.focus = null; }); Store.save('tasks'); scheduleRender(); } }); }
      else toast('Claude didn’t find a clear pick. Star tasks yourself.', { kind: 'warn' });
    } catch (e) { this.fail(e, 'top3'); }
    finally { this.busy.top3 = false; scheduleRender(); }
  },
  async breakDown(id) {
    const t = taskById(id); if (!t || !this.ok || this.busy.break) return;
    const prompt = `Break this task into 3 to 7 concrete next steps, in order. Each step starts with a verb and is under 10 words. Skip steps already listed.
Task: ${t.title}
${t.notes ? 'Notes: ' + t.notes.slice(0, 1500) + '\n' : ''}${(t.subs || []).length ? 'Already listed: ' + t.subs.map(s => s.t).join('; ') + '\n' : ''}${areaById(t.area) ? 'Area of life: ' + areaById(t.area).name + '\n' : ''}
Reply with only a JSON array of strings.`;
    this.busy.break = true; renderDrawer();
    try {
      const res = await this.fn.json(prompt, { modelTier: 'quick', cache: false });
      const steps = (Array.isArray(res) ? res : []).map(s => String(s).trim()).filter(Boolean).slice(0, 8);
      const x = taskById(id);
      if (x && steps.length) { x.subs = (x.subs || []).concat(steps.map(s => ({ id: uid('s'), t: s.slice(0, 140), d: false }))); Store.save('tasks'); toast(`Added ${plural(steps.length, 'step')}`); }
      else toast('No steps came back. Try adding a few notes first.', { kind: 'warn' });
    } catch (e) { this.fail(e, 'break'); }
    finally { this.busy.break = false; scheduleRender(); }
  },
  async week(ws) {
    if (!this.ok || this.busy.week) return;
    const S = weekStats(ws); const r = (Store.get('review').weeks[ws]) || {};
    const byArea = Object.entries(S.byArea).map(([k, n]) => (areaById(k) ? areaById(k).name : 'No area') + ': ' + n).join(', ');
    const prompt = `Write a short weekly review for ${settings().name || 'the user'}, who runs a tuition centre, a trading-card business and corporate AI training in Singapore.
Week of ${fmtLong(ws)}.
Numbers: ${S.done.length} tasks finished (${byArea || 'none'}); habits kept ${S.habitPct == null ? 'n/a' : Math.round(S.habitPct * 100) + '%'}; ${fmtMins(S.focusMins)} of focus sessions; ${S.wos.length} workouts; money in ${fmtMoney(S.inc)}, out ${fmtMoney(S.out)}; average mood ${S.mood ? S.mood.toFixed(1) + '/5' : 'not logged'}; ${S.overdue} tasks overdue; ${S.nextDue} tasks and ${S.nextEvents} events next week.
Finished tasks: ${S.done.slice(0, 25).map(t => t.title).join('; ') || 'none'}.
Their notes — went well: ${r.well || '(blank)'}; got in the way: ${r.improve || '(blank)'}; next week: ${r.next || '(blank)'}.

Plain text, no markdown headings or bold. First, 3 to 4 sentences on how the week went, specific to the numbers and tasks. Then a blank line and exactly 3 lines starting with "→ " each giving one concrete focus for next week. Warm, direct, no flattery.`;
    this.busy.week = true; this.out.week = ''; this.ctl.week = new AbortController(); render();
    try {
      const { text } = await this.fn(prompt, { signal: this.ctl.week.signal, cache: false, onText: ({ text }) => { this.out.week = text; const el = $('#ai-week'); if (el) el.textContent = text; } });
      const re = reviewEntry(ws); re.ai = text; Store.save('review');
    } catch (e) { if (e && e.text) { const re = reviewEntry(ws); re.ai = e.text; Store.save('review'); } this.fail(e, 'week'); }
    finally { this.busy.week = false; this.out.week = ''; scheduleRender(); }
  }
};
ACTIONS.aiPlan = () => AI.plan();
ACTIONS.aiTop3 = () => AI.top3();
ACTIONS.aiBreak = el => AI.breakDown(el.dataset.id);
ACTIONS.aiWeek = el => AI.week(el.dataset.week);
ACTIONS.aiStop = el => { const c = AI.ctl[el.dataset.k]; if (c) c.abort(); };

/* =====================================================================
   Section registry
   ===================================================================== */
Object.assign(VIEWS, {
  today: { label: 'Today', icon: 'sun', render: renderToday, sub: () => fmtLong(todayKey()) },
  tasks: { label: 'Tasks', icon: 'tasks', render: renderTasks, sub: () => plural(tasks().filter(t => !isDone(t)).length, 'open task') },
  calendar: { label: 'Calendar', icon: 'calendar', short: 'Calendar', render: renderCalendar, sub: () => calLabel() },
  habits: { label: 'Habits', icon: 'repeat', render: renderHabits, sub: () => plural(activeHabits().length, 'habit') },
  goals: { label: 'Goals', icon: 'target', render: renderGoals, sub: () => quarterLabel(quarterOf(todayKey())) },
  money: { label: 'Money', icon: 'wallet', render: renderMoney, sub: () => monthLabel(ui.money.month || monthOf(todayKey())) },
  journal: { label: 'Journal', icon: 'book', render: renderJournal, sub: () => fmtLong(ui.journal.date || todayKey()) },
  notes: { label: 'Notes', icon: 'note', render: renderNotes, sub: () => plural(notes().length, 'note') },
  fitness: { label: 'Fitness', icon: 'activity', render: renderFitness, sub: () => 'Week of ' + fmtShort(weekStartOf(todayKey())) },
  focus: { label: 'Focus', icon: 'timer', render: renderFocus, sub: () => ui.focus.running ? 'Timer running' : 'Pomodoro timer' },
  review: { label: 'Weekly review', short: 'Review', icon: 'clipboard', render: renderReview, sub: () => 'Week ' + isoWeek(ui.review.week || weekStartOf(todayKey())).week },
  settings: { label: 'Settings', icon: 'sliders', render: renderSettings, sub: () => Store.mode === 'cloud' ? 'Synced to your Claude account' : 'Saved on this device' }
});
ACTIONS.openTask = el => { closeModal(); openTask(el.dataset.id); };

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click', e => {
  const t = e.target;
  if (t && t.id === 'modal') { closeModal(); return; }
  if (t && t.id === 'cmdk') { closeCmdk(); return; }
  const el = t && t.closest ? t.closest('[data-act]') : null; if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
  if (el.disabled) return;
  try { fn(el, e); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message, { kind: 'bad' }); }
});
document.addEventListener('change', e => {
  const el = e.target.closest ? e.target.closest('[data-change]') : null;
  if (el && CHANGES[el.dataset.change]) { try { CHANGES[el.dataset.change](el, e); } catch (err) { console.error(err); } }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.input && INPUTS[el.dataset.input]) { try { INPUTS[el.dataset.input](el, e); } catch (err) { console.error(err); } }
  if (el.classList && el.classList.contains('autogrow')) autogrow(el);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.closest ? e.target.closest('form[data-submit]') : null; if (!f) return;
  const fn = SUBMITS[f.dataset.submit];
  if (fn) { try { fn(f, e); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message, { kind: 'bad' }); } }
});
document.addEventListener('toggle', e => { const d = e.target; if (d && d.tagName === 'DETAILS' && d.dataset.key) ui.open[d.dataset.key] = d.open; }, true);
document.addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (e.target && e.target.isContentEditable);
  if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === 'k') { e.preventDefault(); ui.cmdk.open ? closeCmdk() : openCmdk(); return; }
  if (e.key === 'Escape') {
    if (ui.cmdk.open) { closeCmdk(); return; }
    if (!$('#modal').hidden) { closeModal(); return; }
    if (ui.sel) { closeDrawer(); return; }
    if (typing) e.target.blur();
    return;
  }
  if (ui.cmdk.open && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) { cmdkKey(e); return; }
  if ((e.key === 'Enter' || e.key === ' ') && !typing && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset.act) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && tag === 'TEXTAREA' && e.target.id === 'td-title') { e.preventDefault(); e.target.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || !Store.ready) return;
  if (!$('#modal').hidden || ui.cmdk.open) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); ACTIONS.newTask(); }
  else if (e.key === '/') { e.preventDefault(); openCmdk(); }
  else if (/^[1-9]$/.test(e.key)) { const v = VIEW_ORDER[+e.key - 1]; if (v) go(v); }
});
/* drag and drop on the task board */
document.addEventListener('dragstart', e => {
  const c = e.target && e.target.closest ? e.target.closest('[data-drag-id]') : null; if (!c) return;
  try { e.dataTransfer.setData('text/plain', c.dataset.dragId); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* ignore */ }
  c.classList.add('dragging');
});
document.addEventListener('dragend', () => { $$('.dragging').forEach(x => x.classList.remove('dragging')); $$('.bcol.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => {
  const col = e.target && e.target.closest ? e.target.closest('[data-drop-status]') : null; if (!col) return;
  e.preventDefault(); try { e.dataTransfer.dropEffect = 'move'; } catch (err) { /* ignore */ }
  $$('.bcol.over').forEach(x => { if (x !== col) x.classList.remove('over'); }); col.classList.add('over');
});
document.addEventListener('drop', e => {
  const col = e.target && e.target.closest ? e.target.closest('[data-drop-status]') : null; if (!col) return;
  e.preventDefault(); let id = ''; try { id = e.dataTransfer.getData('text/plain'); } catch (err) { /* ignore */ }
  col.classList.remove('over'); if (id) setTaskStatus(id, col.dataset.dropStatus);
});

/* keep the day fresh when the page stays open past midnight */
let lastDay = todayKey();
function dayTick() {
  const k = todayKey();
  if (k !== lastDay) {
    const prev = lastDay; lastDay = k;
    if (ui.journal.date === prev) ui.journal.date = k;
    if (ui.cal.cursor === prev) ui.cal.cursor = k;
    if (ui.money.month === monthOf(prev)) ui.money.month = monthOf(k);
    ui.review.week = null;
    Store.get(journalKey(k)); Store.get(moneyKey(k));
    render();
  } else if (Store.ready && ui.view === 'today') {
    const nl = $('.nowline'); if (nl) scheduleRender();
  }
}

/* =====================================================================
   Boot
   ===================================================================== */
function boot(hot) {
  try {
    if (hot && hot.ui && typeof hot.ui === 'object') {
      ['view', 'sel'].forEach(k => { if (hot.ui[k] !== undefined) ui[k] = hot.ui[k]; });
      ['tasks', 'cal', 'money', 'journal', 'notes', 'review', 'goals', 'habits'].forEach(k => { if (hot.ui[k]) Object.assign(ui[k], hot.ui[k]); });
    } else {
      const h = (location.hash || '').replace('#', '');
      const v = VIEWS[h] ? h : lsGet('ui.view', 'today');
      if (VIEWS[v]) ui.view = v;
      Object.assign(ui.tasks, lsGet('ui.tasks', {}), { q: '' });
      Object.assign(ui.cal, lsGet('ui.cal', {}));
    }
  } catch (e) { /* defaults */ }
  if (!VIEWS[ui.view]) ui.view = 'today';
  applyTheme(lsGet('theme', 'system'));
  const tk = todayKey();
  ui.cal.cursor = ui.cal.cursor || tk; ui.money.month = ui.money.month || monthOf(tk); ui.journal.date = ui.journal.date || tk;
  Timer.restore();
  render();
  setTimeout(() => { if (!Store.ready) render(); }, 12500);
  Store.init();
  AI.init();
  setInterval(dayTick, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushAll(); else dayTick(); });
  window.addEventListener('pagehide', () => Store.flushAll());
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (VIEWS[h] && h !== ui.view) go(h); });
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    hot.snapshot(() => ({ ui: { view: ui.view, sel: ui.sel, tasks: ui.tasks, cal: ui.cal, money: ui.money, journal: ui.journal, notes: ui.notes, review: ui.review, goals: ui.goals, habits: ui.habits } }));
  }
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
} catch (e) { boot({}); }
</script>
</body>
