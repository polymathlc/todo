<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Zhi Kai's Daybook: tasks, calendar, habits, goals, money, journal, notes, fitness, focus timer and weekly review in one page.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Zhi Kai's Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ring-binder — a navy spine of index tabs on the left, the open page on the right; phones swap the spine for a bottom dock. */
:root{
  --paper:#EDF0F5; --sheet:#FFFFFF; --sheet-2:#F5F7FB;
  --ink:#131B31; --ink-2:#4F5975; --ink-3:#7F88A1;
  --rule:#D5DBE6; --rule-2:#E5E9F0;
  --accent:#2346D6; --accent-ink:#FFFFFF; --accent-soft:#E1E7FD;
  --hi:#FFE14D; --hi-ink:#2A2300; --hi-mark:#FFE14D;
  --spine:#151E38; --spine-2:#202A4B; --spine-ink:#CDD4E6; --spine-ink-2:#8590AE; --spine-hd:#FFFFFF;
  --good:#15835A; --good-soft:#DCF2E7; --warn:#A86400; --warn-soft:#FBEACB; --bad:#C02E3A; --bad-soft:#FADFE2;
  --scrim:rgba(12,17,32,.42);
  --shadow:0 1px 2px rgba(19,27,49,.06),0 6px 22px rgba(19,27,49,.07);
  --shadow-lg:0 12px 44px rgba(19,27,49,.24);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
  --spine-w:240px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1322; --sheet:#161D30; --sheet-2:#1B2338;
    --ink:#E7EBF5; --ink-2:#A6AFC6; --ink-3:#717B97;
    --rule:#2B3451; --rule-2:#222A42;
    --accent:#86A0FF; --accent-ink:#0B1230; --accent-soft:#1E2A55;
    --hi:#E9D23C; --hi-ink:#221E00; --hi-mark:rgba(233,210,60,.34);
    --spine:#080C18; --spine-2:#141B30; --spine-ink:#C2CAE0; --spine-ink-2:#6F7999; --spine-hd:#FFFFFF;
    --good:#4CC58E; --good-soft:#12352A; --warn:#E5A33B; --warn-soft:#3A2A10; --bad:#F06B74; --bad-soft:#3D1A1F;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --shadow-lg:0 14px 48px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1322; --sheet:#161D30; --sheet-2:#1B2338;
  --ink:#E7EBF5; --ink-2:#A6AFC6; --ink-3:#717B97;
  --rule:#2B3451; --rule-2:#222A42;
  --accent:#86A0FF; --accent-ink:#0B1230; --accent-soft:#1E2A55;
  --hi:#E9D23C; --hi-ink:#221E00; --hi-mark:rgba(233,210,60,.34);
  --spine:#080C18; --spine-2:#141B30; --spine-ink:#C2CAE0; --spine-ink-2:#6F7999; --spine-hd:#FFFFFF;
  --good:#4CC58E; --good-soft:#12352A; --warn:#E5A33B; --warn-soft:#3A2A10; --bad:#F06B74; --bad-soft:#3D1A1F;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --shadow-lg:0 14px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ---------- base ---------- */
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:12.5px} .tiny{font-size:11px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.row.top{align-items:flex-start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack.tight{gap:8px}
.list-plain{list-style:none;margin:0;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
.count{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:var(--spine-w) minmax(0,1fr);min-height:100%}
.spine{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--spine);color:var(--spine-ink);display:flex;flex-direction:column;gap:20px;padding:18px 0 16px 14px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding-right:14px}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--hi);color:var(--hi-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em;flex:none;transform:rotate(-3deg)}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--spine-hd);line-height:1.1}
.brand-sub{font-size:12px;color:var(--spine-ink-2);font-family:var(--f-mono)}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:8px 14px 8px 12px;border-radius:10px 0 0 10px;color:var(--spine-ink);font-weight:700;font-size:14px}
.tab:hover{background:var(--spine-2)}
.tab .badge{margin-left:auto;font-family:var(--f-mono);font-weight:400;font-size:11px;background:var(--spine-2);color:var(--spine-ink);padding:1px 7px;border-radius:99px}
.tab.on{background:var(--paper);color:var(--ink)}
.tab.on::before,.tab.on::after{content:"";position:absolute;right:0;width:14px;height:14px;pointer-events:none}
.tab.on::before{top:-14px;border-bottom-right-radius:14px;box-shadow:5px 5px 0 5px var(--paper)}
.tab.on::after{bottom:-14px;border-top-right-radius:14px;box-shadow:5px -5px 0 5px var(--paper)}
.tab.on .badge{background:var(--hi);color:var(--hi-ink)}
.spine-label{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--spine-ink-2);padding:0 14px 6px 12px}
.area-tab{display:flex;align-items:center;gap:10px;width:calc(100% - 14px);padding:6px 10px 6px 12px;border-radius:8px;color:var(--spine-ink);font-size:13.5px}
.area-tab:hover{background:var(--spine-2)}
.area-tab .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.area-tab span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area-tab b{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--spine-ink-2)}
.spine-foot{margin-top:auto;padding-right:14px;display:flex;flex-direction:column;gap:8px}
.spine-foot .sync{color:var(--spine-ink-2);border-color:var(--spine-2)}
.spine-kbd{font-size:11.5px;color:var(--spine-ink-2)}
.spine-kbd .kbd{background:transparent;color:var(--spine-ink-2);border-color:var(--spine-2)}

.page{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:14px clamp(16px,3vw,36px) 12px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tb-title{min-width:0}
.tb-title h1{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title .sub{color:var(--ink-3);font-size:12.5px;font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{padding-inline:clamp(16px,3vw,36px);padding-block:6px 120px;max-width:1340px;width:100%;outline:none}

.dock{display:none}
.fab{display:none}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  .spine{display:none}
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--spine);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px}
  .dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--spine-ink-2);font-size:11px;font-weight:700;border-radius:10px}
  .dock button.on{color:var(--spine-hd)}
  .dock button.on .i{stroke:var(--hi)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:31;width:54px;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-lg)}
  .fab .i{width:24px;height:24px;stroke-width:2.2}
  .lbl-desk,.tb-search .kbd{display:none}
    .tb-title h1{font-size:21px}
}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border-radius:9px;background:var(--sheet);border:1px solid var(--rule);font-weight:700;font-size:13.5px;line-height:1.2;white-space:nowrap;transition:background .15s,border-color .15s,filter .15s;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sheet-2);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--rule))}
.btn.danger.solid{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px;gap:5px}
.btn.sm .i{width:15px;height:15px}
.btn.icon{padding:0;width:34px;height:34px}
.btn.icon.sm{width:28px;height:28px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.spark .i{stroke:var(--accent)}
.kbd{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border:1px solid var(--rule);border-radius:5px;color:var(--ink-3);background:var(--sheet-2);font-weight:400}
.linkbtn{color:var(--accent);font-weight:700;font-size:13px}
.linkbtn:hover{text-decoration:underline}

.inp{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--sheet);color:var(--ink);font-size:14.5px;min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.55}
select.inp{padding-right:28px}
input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);cursor:pointer;flex:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.lbl{font-size:12px;font-weight:700;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule-2);white-space:nowrap;max-width:100%}
.chip.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.area{background:color-mix(in srgb,var(--c) 14%,var(--sheet));border-color:color-mix(in srgb,var(--c) 32%,var(--sheet));color:var(--ink)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ex,.tag-ex{font-family:var(--f-mono);font-size:10.5px;font-weight:400;text-transform:uppercase;letter-spacing:.08em;background:transparent;border:1px dashed var(--ink-3);color:var(--ink-3);padding:0 6px;border-radius:5px}
button.chip{cursor:pointer}
button.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3));flex:none;display:inline-block}

.seg{display:inline-flex;padding:3px;background:var(--sheet-2);border:1px solid var(--rule-2);border-radius:10px;gap:2px;max-width:100%;overflow-x:auto}
.seg button,.seg label{padding:5px 11px;border-radius:7px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;position:relative}
.seg button.on,.seg label:has(input:checked){background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.seg .i{width:15px;height:15px}

.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick label{position:relative}
.daypick input{position:absolute;opacity:0;pointer-events:none}
.daypick span{display:grid;place-items:center;min-width:40px;height:32px;padding:0 6px;border-radius:8px;border:1px solid var(--rule);font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;background:var(--sheet)}
.daypick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daypick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.daypick button{min-width:40px;height:32px;padding:0 6px;border-radius:8px;border:1px solid var(--rule);font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--sheet)}
.daypick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none;color:transparent;transition:background .15s,border-color .15s,color .15s;background:var(--sheet)}
.check .i{width:14px;height:14px;stroke-width:3}
.check.p3{border-color:var(--bad)} .check.p2{border-color:var(--warn)} .check.p1{border-color:var(--accent)}
.check:hover{color:var(--ink-3)}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check.round{border-radius:50%}

.bar{height:8px;border-radius:99px;background:var(--rule-2);overflow:hidden;min-width:40px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}
.bar.good>i{background:var(--good)}
.bar.thin{height:5px}

.hl{background:linear-gradient(100deg,transparent 1%,var(--hi-mark) 3%,var(--hi-mark) 95%,transparent 98%) 0 66%/100% 52% no-repeat;padding:0 4px;margin:0 -2px}

/* ---------- panels & layout ---------- */
.panel{background:var(--sheet);border:1px solid var(--rule-2);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>header,.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel h3{font-size:16.5px;font-weight:700}
.panel.tight{padding:12px 14px}
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 18px}
.vhead h2{font-size:22px;font-weight:700}
.sub-h,.group-h{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sub-h:first-child,.group-h:first-child{margin-top:0}
.sub-h.late,.group-h.late{color:var(--bad)}
.group-h .ln{flex:1;height:1px;background:var(--rule-2)}
.empty{padding:18px 10px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px}
.empty b{color:var(--ink-2);font-family:var(--f-display);font-size:16px;font-weight:600}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--ink-3);border-radius:var(--r);margin-bottom:18px;font-size:13.5px;color:var(--ink-2);background:var(--sheet)}
.banner .grow{min-width:200px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule-2);min-width:0}
.lrow:first-child{border-top:0}
.lrow.wr{flex-wrap:wrap;row-gap:6px}
.lrow.wr>.grow{flex:1 1 190px}
.lrow .grow{overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--sheet);border:1px solid var(--rule-2);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.tile .v.pos{color:var(--good)} .tile .v.neg{color:var(--bad)}
.tile .s{font-size:12px;color:var(--ink-3)}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1060px){.two{grid-template-columns:minmax(0,1fr)}}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:left;font-weight:400;padding:6px 8px;border-bottom:1px solid var(--rule)}
.tbl td{padding:8px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--rule)}

/* ---------- quick add ---------- */
.qa{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 12px;border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet)}
.qa:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qa-icon{color:var(--ink-3);display:grid}
.qa-input{flex:1;min-width:0;border:0;background:transparent;font-size:15.5px;padding:7px 0;outline:none}
.qa-preview{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--ink-3);min-height:22px}
.qa-preview code{font-family:var(--f-mono);font-size:11.5px;background:var(--sheet-2);padding:1px 5px;border-radius:4px;color:var(--ink-2)}
.tok{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px}
.tok .i{width:13px;height:13px}

/* ---------- tasks ---------- */
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trow{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-radius:9px;position:relative}
.trow+.trow{box-shadow:0 -1px 0 var(--rule-2)}
.trow:hover{background:var(--sheet-2)}
.trow .check{margin-top:1px}
.trow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left}
.trow-title{font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.trow-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.trow-meta:empty{display:none}
.meta{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.meta .i{width:13px;height:13px}
.meta.late{color:var(--bad);font-weight:700}
.meta.today{color:var(--accent);font-weight:700}
.meta.st{font-weight:700;color:var(--warn)}
.trow.is-done .trow-title{text-decoration:line-through;color:var(--ink-3);font-weight:400}
.trow.is-sel{background:var(--accent-soft)}
.pin{opacity:0;color:var(--ink-3);padding:4px;border-radius:6px;display:grid}
.pin:hover{color:var(--ink)}
.trow:hover .pin,.pin.on,.pin:focus-visible{opacity:1}
.pin.on .i,.slot .i.star{fill:var(--hi);stroke:color-mix(in srgb,var(--hi) 55%,var(--ink))}
@media (hover:none){.pin{opacity:.55}}

.tasks-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.lists{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.lists button{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--ink-2);text-align:left;white-space:nowrap}
.lists button:hover{background:var(--sheet-2)}
.lists button.on{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.lists button .n{margin-left:auto;font-family:var(--f-mono);font-weight:400;font-size:11.5px;color:var(--ink-3)}
.lists .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.lists .sep{height:1px;background:var(--rule);margin:8px 10px}
@media (max-width:900px){
  .tasks-wrap{grid-template-columns:minmax(0,1fr);gap:12px}
  .lists{position:static;flex-direction:row;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
  .lists .sep{display:none}
  .lists button{flex:none}
}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:180px}
.search .i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search .inp{padding-left:36px}
.list-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.list-title h2{font-size:22px}
.list-title .sw{width:14px;height:14px;border-radius:4px;background:var(--c)}

.board-scroll{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;min-width:960px}
.bcol{background:var(--sheet-2);border:1px solid var(--rule-2);border-radius:var(--r);padding:10px;min-height:240px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s}
.bcol.over{border-color:var(--accent);background:var(--accent-soft)}
.bcol h4{font-size:13.5px;display:flex;gap:8px;align-items:center;padding:2px 4px 4px}
.bcard{background:var(--sheet);border:1px solid var(--rule-2);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab;text-align:left;width:100%}
.bcard:hover{border-color:var(--rule)}
.bcard.dragging{opacity:.4}
.bcard .t{font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.bcard.is-done .t{text-decoration:line-through;color:var(--ink-3)}

.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quad{border-radius:var(--r);padding:14px 16px;border:1px solid var(--rule-2);background:var(--sheet);min-height:200px;min-width:0}
.quad header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.quad h4{font-size:15px}
.quad .hint{font-size:12.5px;color:var(--ink-3);margin:2px 0 8px}
.matrix-axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin-bottom:6px}
@media (max-width:720px){.matrix{grid-template-columns:minmax(0,1fr)}}

/* ---------- drawer, modal, palette, toast ---------- */
#drawer{position:fixed;inset:0;z-index:50;pointer-events:none}
#drawer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:.6;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--sheet);border-left:1px solid var(--rule);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slidein .2s ease;pointer-events:auto}
.drawer-h{display:flex;align-items:center;gap:6px;padding:10px 14px 10px 18px;border-bottom:1px solid var(--rule-2)}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:16px}
.title-input{font-family:var(--f-display);font-size:22px;font-weight:700;border:0;padding:0;width:100%;resize:none;background:transparent;line-height:1.25;overflow:hidden;outline:none;min-height:30px}
.title-input:focus{box-shadow:0 2px 0 var(--accent)}
.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.subs li{display:flex;align-items:center;gap:8px;padding:3px 0}
.subs input{border:0;background:transparent;flex:1;min-width:0;padding:4px 2px;border-bottom:1px solid transparent;font-size:14.5px}
.subs input:focus{outline:none;border-bottom-color:var(--accent)}
.subs li.on input{text-decoration:line-through;color:var(--ink-3)}
.subs .check{width:19px;height:19px;border-radius:6px}
.dmeta{font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}
@keyframes slidein{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}

.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.mbox{width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto;background:var(--sheet);border-radius:16px;box-shadow:var(--shadow-lg);padding:20px 22px;display:flex;flex-direction:column;gap:14px;animation:pop .18s ease}
.mbox.wide{width:min(760px,100%)}
.mbox h3{font-size:20px}
.mfoot{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
@media (max-width:600px){
  .modal{place-items:end stretch;padding:0}
  .mbox{width:100%;border-radius:18px 18px 0 0;max-height:92%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
.more-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.more-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:12px;border:1px solid var(--rule-2);background:var(--sheet-2);font-weight:700;font-size:13px}
.more-grid button.on{border-color:var(--accent);color:var(--accent)}
.more-grid .i{width:22px;height:22px}

.cmdk{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:11vh 16px 16px}
.cmdk-box{width:min(620px,100%);background:var(--sheet);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:72vh;animation:pop .15s ease}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--rule-2);color:var(--ink-3)}
.cmdk-in input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;outline:none;color:var(--ink)}
.cmdk-list{overflow-y:auto;padding:6px}
.cmdk-sec{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 4px}
.cmdk-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;text-align:left;color:var(--ink)}
.cmdk-item>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk-item .i{color:var(--ink-3)}
.cmdk-item.on{background:var(--accent-soft)}
.cmdk-item .k{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono);flex:none}
.cmdk-foot{padding:8px 14px;border-top:1px solid var(--rule-2);font-size:11.5px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(480px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);padding:11px 14px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:14px;width:100%;animation:pop .2s ease}
.toast.warn{background:var(--warn);color:var(--sheet)}
.toast.bad{background:var(--bad);color:var(--sheet)}
.toast span{flex:1;min-width:0}
.toast button{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;flex:none}
@media (max-width:860px){#toasts{bottom:calc(144px + env(safe-area-inset-bottom,0px))}}

.topbar .sync{display:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-3);padding:4px 10px;border:1px solid var(--rule-2);border-radius:99px;white-space:nowrap}
.sync .i{width:14px;height:14px}
.sync.saving .i{animation:pulse 1s ease-in-out infinite}
.sync.error{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
@keyframes pulse{50%{opacity:.35}}
.focus-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.focus-pill .i{width:14px;height:14px}

.loading{min-height:56vh;display:grid;place-items:center;text-align:center}
.bar-anim{width:180px;height:4px;border-radius:99px;background:var(--rule-2);overflow:hidden;position:relative}
.bar-anim::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--accent);animation:load 1.1s ease-in-out infinite;border-radius:inherit}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ---------- today ---------- */
.today-head{display:flex;align-items:flex-end;gap:30px;flex-wrap:wrap;padding:6px 0 22px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.datebig{display:flex;align-items:flex-end;gap:14px}
.dnum{font-family:var(--f-display);font-weight:700;font-size:92px;line-height:.78;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.dname{font-family:var(--f-display);font-size:27px;font-weight:700;line-height:1.05}
.dsub{color:var(--ink-3);font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-top:3px}
.today-greet{flex:1;min-width:250px;display:flex;flex-direction:column;gap:8px}
.today-greet h2{font-size:22px;font-weight:600}
.today-greet p{color:var(--ink-2);max-width:64ch}
.today-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1060px){.today-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.dnum{font-size:72px}.dname{font-size:23px}}
.top3-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--sheet-2);border:1px solid var(--rule-2);min-width:0}
.slot .n{font-family:var(--f-display);font-weight:700;font-size:22px;width:20px;text-align:center;color:var(--ink-3);flex:none}
.slot.blank{border-style:dashed;color:var(--ink-3);font-size:13.5px;background:transparent}
.slot.blank .i{width:14px;height:14px;vertical-align:-2px}
.slot.filled .n{color:var(--ink)}
.slot-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.slot-main .ttl{font-weight:700;overflow-wrap:anywhere}
.slot .why{font-size:12.5px;color:var(--ink-3);font-style:italic}
.slot.done .ttl{text-decoration:line-through;color:var(--ink-3)}
.agenda{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ag{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--rule-2);align-items:start;text-align:left;width:100%}
.ag:first-child{border-top:0}
.ag time{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);padding-top:1px}
.ag .what{display:flex;flex-direction:column;gap:1px;border-left:3px solid var(--c,var(--rule));padding-left:10px;min-width:0}
.ag .what b{overflow-wrap:anywhere}
.ag.past{opacity:.5}
.nowline{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--bad);padding:4px 0}
.nowline::after{content:"";flex:1;height:1px;background:var(--bad)}
.hab-today{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.hbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);text-align:left;min-width:0}
.hbtn:hover{border-color:var(--ink-3)}
.hbtn .check{pointer-events:none}
.hbtn.on{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,var(--rule))}
.hbtn.on .check{background:var(--good);border-color:var(--good);color:var(--sheet)}
.hbtn .nm{font-weight:700;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.hbtn .st{font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{padding:9px 2px;border-radius:9px;border:1px solid var(--rule);font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-2);background:var(--sheet)}
.mood i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.mood.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--sheet));color:var(--ink)}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wday{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:9px;border:1px solid transparent;min-width:0}
.wday:hover{background:var(--sheet-2)}
.wday .dl{font-size:10.5px;font-family:var(--f-mono);color:var(--ink-3);text-transform:uppercase}
.wday .dn{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1}
.wday .pips{display:flex;gap:4px;height:6px;flex-wrap:wrap;justify-content:center}
.wday .pips i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.wday .pips i.ev{background:var(--ink-3)}
.wday.today{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.wday.past .dn{color:var(--ink-3)}
.ai-out{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;line-height:1.65;background:var(--sheet-2);border:1px solid var(--rule-2);border-radius:10px;padding:12px 14px;color:var(--ink);overflow-wrap:anywhere}
.ai-out.prose{font-family:var(--f-body);font-size:14.5px}
.ai-out:empty{display:none}

/* ---------- calendar ---------- */
.wk-scroll{overflow-x:auto;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet)}
.wk{display:grid;grid-template-columns:56px repeat(7,minmax(112px,1fr));min-width:840px}
.wk-corner,.wk-adl{border-bottom:1px solid var(--rule)}
.wk-adl{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);text-align:right;padding:8px 8px 0 0;text-transform:uppercase}
.wk-dayh{padding:8px 6px;border-left:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.wk-dayh .dl{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;color:var(--ink-3)}
.wk-dayh .dn{font-family:var(--f-display);font-weight:700;font-size:19px;padding:0 6px;border-radius:7px;line-height:1.3}
.wk-dayh.today .dn{background:var(--accent);color:var(--accent-ink)}
.wk-dayh .tag{font-size:10px;color:var(--ink-3)}
.wk-allday{border-left:1px solid var(--rule-2);border-bottom:1px solid var(--rule);padding:4px;display:flex;flex-direction:column;gap:3px;min-height:36px;min-width:0;cursor:copy}
.wk-hours{position:relative}
.wk-hour:first-child{transform:none}
.wk-hour{height:44px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);text-align:right;padding-right:8px;transform:translateY(-7px)}
.wk-col{position:relative;border-left:1px solid var(--rule-2);background-image:repeating-linear-gradient(to bottom,transparent 0 43px,var(--rule-2) 43px 44px);cursor:copy;min-width:0}
.wk-col.off{background-color:var(--sheet-2)}
.ev{position:absolute;border-radius:7px;padding:3px 6px;font-size:12px;line-height:1.25;overflow:hidden;background:color-mix(in srgb,var(--c,var(--accent)) 18%,var(--sheet));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 50%,var(--sheet));color:var(--ink);text-align:left;cursor:pointer;z-index:1}
.ev:hover{z-index:3;box-shadow:var(--shadow)}
.ev b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev time{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);display:block}
.ev.ex{border-style:dashed}
.nowbar{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.nowbar::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.tpill{font-size:11.5px;padding:2px 6px;border-radius:5px;background:var(--sheet-2);border:1px solid var(--rule-2);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;width:100%;min-width:0}
.tpill.done{text-decoration:line-through;color:var(--ink-3)}
.tpill.evp{background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--sheet));border-color:color-mix(in srgb,var(--c,var(--accent)) 40%,var(--sheet))}
.tpill .dot{width:6px;height:6px}
.wk-list{display:none;flex-direction:column;gap:10px}
.wl-day{background:var(--sheet);border:1px solid var(--rule-2);border-radius:var(--r);padding:12px 14px}
.wl-day.today{border-color:var(--accent)}
.wl-day header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wl-day h4{font-size:15px}
@media (max-width:720px){.wk-scroll{display:none}.wk-list{display:flex}}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;background:var(--rule-2);gap:1px}
.mhd{background:var(--sheet-2);padding:7px 4px;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;color:var(--ink-3);text-align:center}
.mcell{background:var(--sheet);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;align-items:stretch}
.mcell:hover{background:var(--sheet-2)}
.mcell.out{background:var(--sheet-2)}
.mcell.out .md{color:var(--ink-3)}
.mcell .md{font-family:var(--f-mono);font-size:12px;align-self:flex-start;padding:0 5px;border-radius:6px}
.mcell.today .md{background:var(--accent);color:var(--accent-ink)}
.mcell .more{font-size:11px;color:var(--ink-3)}
.mdots{display:none;gap:3px;flex-wrap:wrap}
.mdots i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--accent))}
@media (max-width:640px){.mcell{min-height:62px;padding:4px}.mcell .tpill,.mcell .more{display:none}.mdots{display:flex}}

/* ---------- habits ---------- */
.htable-wrap{overflow-x:auto}
.htable{width:100%;border-collapse:collapse;min-width:620px}
.htable th,.htable td{padding:8px 4px;border-bottom:1px solid var(--rule-2);text-align:center}
.htable th{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;color:var(--ink-3);font-weight:400}
.htable th.today{color:var(--accent);font-weight:500}
.htable th:first-child,.htable td:first-child{text-align:left;padding-left:2px}
.htable tr:last-child td{border-bottom:0}
.hname{display:flex;align-items:center;gap:8px;min-width:170px}
.hname b{overflow-wrap:anywhere}
.hcell{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--rule);display:inline-grid;place-items:center;color:transparent;background:var(--sheet)}
.hcell .i{width:15px;height:15px;stroke-width:3}
.hcell:hover{border-color:var(--ink-3)}
.hcell.on{background:var(--good);border-color:var(--good);color:var(--sheet)}
.hcell.rest{border-style:dashed;opacity:.55}
.hcell[disabled]{opacity:.2;cursor:default}
.streak{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.streak.hot{color:var(--warn);font-weight:500}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.heat span{aspect-ratio:1;border-radius:3px;background:var(--rule-2)}
.heat span.fut{background:transparent}
.heat-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3);align-items:center}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}
.legend span{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---------- goals ---------- */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px;align-items:start}
.goal{display:flex;flex-direction:column;gap:12px}
.goal-top{display:flex;align-items:flex-start;gap:12px}
.goal-top h3{font-size:18px;overflow-wrap:anywhere}
.pct{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.pct small{font-size:14px;color:var(--ink-3)}
.why{font-size:13.5px;color:var(--ink-2);font-style:italic}
.kr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--rule-2)}
.kr .kt{font-weight:700;font-size:13.5px;overflow-wrap:anywhere}
.kr .bar{grid-column:1/-1}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.stepper button{width:28px;height:28px;display:grid;place-items:center;color:var(--ink-2)}
.stepper button:hover{background:var(--sheet-2);color:var(--ink)}
.stepper input{width:58px;border:0;border-left:1px solid var(--rule-2);border-right:1px solid var(--rule-2);text-align:center;font-family:var(--f-mono);font-size:12.5px;height:28px;background:transparent;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.of{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.goal.done{opacity:.8}

/* ---------- charts ---------- */
.hbars{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:var(--h,170px) auto;gap:6px 10px}
.hb-y{grid-row:1;grid-column:1;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);text-align:right;margin:-7px 0}
.hb-plot{grid-row:1;grid-column:2;position:relative;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--rule)}
.hb-grid{position:absolute;left:0;right:0;height:1px;background:var(--rule-2);pointer-events:none}
.hb-g{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;position:relative;z-index:1;min-width:0}
.hb-bar{width:min(20px,42%);border-radius:4px 4px 0 0;display:block}
.hb-bar.in{background:var(--good)} .hb-bar.out{background:var(--bad);opacity:.82} .hb-bar.acc{background:var(--accent)} .hb-bar.mut{background:var(--ink-3);opacity:.55}
.hb-g.hi .hb-bar.acc{background:var(--accent)} .hb-g:not(.hi) .hb-bar.acc{opacity:.55}
.hb-x{grid-row:2;grid-column:2;display:flex;gap:6px}
.hb-x span{flex:1;text-align:center;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);min-width:0;overflow:hidden;white-space:nowrap}
.hb-x span.hi{color:var(--ink);font-weight:500}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.keyrow i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.spark{position:relative;width:100%}
.spark svg{width:100%;height:100%;display:block;overflow:visible}
.spark .sl{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.spark .sa{fill:var(--accent);opacity:.12}
.spark .sd{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--sheet);transform:translate(-50%,-50%)}
.spark .lab{position:absolute;left:0;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);background:var(--sheet);padding:0 3px}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .track{fill:none;stroke:var(--rule-2)}
.ring .prog{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring.good .prog{stroke:var(--good)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:700}
.catbar{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.catbar .r{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}

/* ---------- money ---------- */
.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--good)}
.txn-desc{display:flex;flex-direction:column;gap:2px;min-width:0}
.txn-desc b{font-weight:700;overflow-wrap:anywhere}

/* ---------- journal ---------- */
.prompt{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.35;padding:16px 18px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink)}
.prompt .eyebrow{display:block;margin-bottom:4px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mcal .hd{font-size:10px;text-align:center;color:var(--ink-3);font-family:var(--f-mono);text-transform:uppercase}
.mcal button{aspect-ratio:1;border-radius:7px;background:var(--sheet-2);font-family:var(--f-mono);font-size:11px;color:var(--ink-3);border:1.5px solid transparent;min-width:0}
.mcal button.has{background:color-mix(in srgb,var(--c) 70%,var(--sheet));color:var(--ink)}
.mcal button.wrote{box-shadow:inset 0 -3px 0 var(--accent)}
.mcal button.sel{border-color:var(--ink)}
.mcal button.fut{opacity:.4}
.mcal span{aspect-ratio:1}
.gratrow{display:flex;align-items:center;gap:10px}
.gratrow .n{font-family:var(--f-display);font-weight:700;color:var(--ink-3);width:14px}
.jnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ---------- notes ---------- */
.notes-wrap{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}
.nside{display:flex;flex-direction:column;gap:10px;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto;padding:2px}
.nitem{padding:10px 12px;border-radius:10px;background:var(--sheet);border:1px solid var(--rule-2);text-align:left;display:flex;flex-direction:column;gap:3px;width:100%;min-width:0}
.nitem:hover{border-color:var(--rule)}
.nitem.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nitem .t{font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.nitem .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .s{font-size:12.5px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nitem .d{font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}
.neditor{display:flex;flex-direction:column;gap:12px;min-height:62vh}
.nt{font-family:var(--f-display);font-size:26px;font-weight:700;border:0;background:transparent;width:100%;padding:2px 0;outline:none;color:var(--ink)}
.nb{min-height:48vh;border:0;background:transparent;width:100%;resize:vertical;line-height:1.7;font-size:15.5px;padding:0;outline:none;color:var(--ink)}
.md{line-height:1.7;font-size:15.5px;overflow-wrap:anywhere;max-width:72ch}
.md h4{font-size:18px;margin:14px 0 6px}
.md h5{font-size:15.5px;margin:12px 0 4px;font-family:var(--f-display)}
.md p{margin:0 0 10px}
.md ul,.md ol{padding-left:22px;margin:0 0 10px}
.md li.task{list-style:none;margin-left:-20px;display:flex;gap:8px;align-items:baseline}
.md li.task.done span{text-decoration:line-through;color:var(--ink-3)}
.md code{font-family:var(--f-mono);font-size:13px;background:var(--sheet-2);padding:1px 5px;border-radius:4px}
.md blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid var(--rule);color:var(--ink-2)}
.back-btn{display:none}
.check.big{width:26px;height:26px;margin-top:3px}
@media (max-width:860px){
  .back-btn{display:inline-flex}
  .notes-wrap{grid-template-columns:minmax(0,1fr)}
  .nside{position:static;max-height:none}
  .notes-wrap.has-sel .nside{display:none}
  .notes-wrap:not(.has-sel) .nmain{display:none}
}

/* ---------- focus ---------- */
.timer{display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 16px}
.tring{width:min(310px,74vw)}
.tring .rt{gap:2px}
.tdisp{font-family:var(--f-mono);font-size:clamp(46px,11vw,68px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.tmode{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
.cycle{display:flex;gap:7px}
.cycle i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-3)}
.cycle i.on{background:var(--accent);border-color:var(--accent)}
.tctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.tctl .btn.big{padding:12px 26px;font-size:15px;border-radius:12px}

/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:16px;align-items:start}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule-2);flex-wrap:wrap}
.srow:first-of-type{border-top:0}
.srow .inp{flex:1;min-width:140px}
.kbd-list{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;align-items:center}
.codebox{width:100%;min-height:200px;font-family:var(--f-mono);font-size:12px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<script>
'use strict';
/* =====================================================================
   Zhi Kai's Daybook — one place for tasks, calendar, habits, goals,
   money, journal, notes, fitness, focus sessions and weekly reviews.
   Data lives in the artifact's private store (owner only) when opened
   in Claude; otherwise it is kept in this browser.
   ===================================================================== */

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'x') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const pad = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const sum = arr => arr.reduce((a, b) => a + (Number(b) || 0), 0);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const plural = (n, w, pl) => n + ' ' + (n === 1 ? w : (pl || w + 's'));
const safeColor = (c, fb = '#7C86A2') => (/^#[0-9a-f]{6}$/i.test(String(c || '')) ? c : fb);
const cap = s => (s ? s[0].toUpperCase() + s.slice(1) : s);

/* ---------- dates (all keys are local YYYY-MM-DD) ---------- */
const DAY_MS = 864e5;
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYS_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fromKey(k) { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function todayKey() { return keyOf(new Date()); }
function addDays(k, n) { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
function diffDays(a, b) { return Math.round((fromKey(a) - fromKey(b)) / DAY_MS); }
function dow(k) { return fromKey(k).getDay(); }
function isKey(k) { return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k); }
function weekStartOf(k) {
  const ws = Store.ready ? (Number(Store.get('settings').weekStart) || 0) : 1;
  return addDays(k, -((dow(k) - ws + 7) % 7));
}
function monthOf(k) { return k.slice(0, 7); }
function addMonths(mk, n) { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthLabel(mk, full = true) { const [y, m] = mk.split('-').map(Number); return (full ? MONTHS_FULL : MONTHS)[m - 1] + ' ' + y; }
function daysInMonth(mk) { const [y, m] = mk.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function fmtShort(k) { const d = fromKey(k); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function fmtDay(k) { const d = fromKey(k); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function fmtLong(k) { const d = fromKey(k); return DAYS_FULL[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_FULL[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtTime(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; const hh = ((h + 11) % 12) + 1; return hh + (m ? ':' + pad(m) : '') + ap; }
function nowHM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function hmToMin(t) { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); }
function minToHM(n) { n = clamp(Math.round(n), 0, 24 * 60 - 1); return pad(Math.floor(n / 60)) + ':' + pad(n % 60); }
function fmtMins(m) { m = Math.round(Number(m) || 0); if (m < 60) return m + 'm'; const h = Math.floor(m / 60), r = m % 60; return h + 'h' + (r ? ' ' + r + 'm' : ''); }
function mmss(s) { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
function isoWeek(k) {
  const d = fromKey(k); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - dn + 3);
  const fy = t.getUTCFullYear(); const ft = new Date(Date.UTC(fy, 0, 4));
  const w = 1 + Math.round(((t - ft) / DAY_MS - 3 + ((ft.getUTCDay() + 6) % 7)) / 7);
  return { year: fy, week: w };
}
function quarterOf(k) { const d = fromKey(k); return d.getFullYear() + '-Q' + (Math.floor(d.getMonth() / 3) + 1); }
function quarterLabel(q) { const [y, n] = q.split('-Q'); return 'Q' + n + ' ' + y; }
function quarterEnd(q) { const [y, n] = q.split('-Q').map(Number); return keyOf(new Date(y, n * 3, 0)); }
function nextQuarter(q, by = 1) { let [y, n] = q.split('-Q').map(Number); n += by; while (n > 4) { n -= 4; y++; } while (n < 1) { n += 4; y--; } return y + '-Q' + n; }
function dayOfYear(k) { const d = fromKey(k); return Math.round((d - new Date(d.getFullYear(), 0, 1)) / DAY_MS) + 1; }
function daysInYear(y) { return ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365; }
function relLabel(k) {
  const d = diffDays(k, todayKey());
  if (d === 0) return 'Today'; if (d === 1) return 'Tomorrow'; if (d === -1) return 'Yesterday';
  if (d > 1 && d < 7) return DAYS_FULL[dow(k)];
  return fmtDay(k);
}
function dueWords(k) { const r = relLabel(k); return (r === 'Today' || r === 'Tomorrow' || r === 'Yesterday') ? r.toLowerCase() : r; }
function greeting() { const h = new Date().getHours(); return h < 5 ? 'Still up' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
function isoToKey(iso) { if (!iso) return null; const d = new Date(iso); return isNaN(d) ? null : keyOf(d); }
function rangeKeys(a, n) { const out = []; for (let i = 0; i < n; i++) out.push(addDays(a, i)); return out; }

/* ---------- money formatting ---------- */
function curSym() { return Store.ready ? (Store.get('settings').currency || 'S$') : 'S$'; }
function fmtMoney(n, sign = false) {
  const v = Number(n) || 0;
  const s = Math.abs(v).toLocaleString('en-SG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (v < 0 ? '−' : (sign && v > 0 ? '+' : '')) + curSym() + s;
}
function fmtMoneyShort(n) {
  const v = Math.abs(Number(n) || 0); let s;
  if (v >= 1e6) s = (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'm';
  else if (v >= 1e3) s = (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'k';
  else s = String(Math.round(v));
  return (n < 0 ? '−' : '') + curSym() + s.replace(/\.0(?=[km])/, '');
}

/* ---------- icons ---------- */
const ICONS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  tasks: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',

  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  wallet: '<rect x="2" y="5" width="20" height="15" rx="2"/><path d="M2 10h20M16 15h2"/>',
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  note: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  clipboard: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 14l2 2 4-4"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',

/* ---------- browser storage (per-viewer conveniences + device mode) ---------- */
const LS = 'daybook.v1.';
function lsGet(k, fb) { try { const v = localStorage.getItem(LS + k); return v == null ? fb : JSON.parse(v); } catch (e) { return fb; } }

/* =====================================================================
   Store — one JSON document per module under life/<key>.
   cloud: the artifact db (rules keep life/* readable and writable by the
   owner only). local: this browser. memory: nothing persists.
   ===================================================================== */
const Store = {
  mode: 'loading', db: null, why: '', ready: false, status: 'saved',
  data: {}, loaded: {}, waiters: {}, unsubs: {}, pending: {}, writing: {}, again: {}, timers: {},
  base(k) { return k.replace(/-\d{4}$/, ''); },
  fresh(k) { const f = DEFAULTS[this.base(k)]; return f ? f() : {}; },
  get(k) {
    if (!this.data[k]) { this.data[k] = this.fresh(k); this.watch(k); }
    return this.data[k];
  },
  isLoaded(k) { this.get(k); return !!this.loaded[k]; },
  whenLoaded(k) {
    this.get(k);
    if (this.loaded[k]) return Promise.resolve();
    return new Promise(r => (this.waiters[k] = this.waiters[k] || []).push(r));
  },
  markLoaded(k) {
    if (this.loaded[k]) return;
    this.loaded[k] = true;
    (this.waiters[k] || []).forEach(f => f());
    delete this.waiters[k];
  },
  watch(k) {
    if (this.mode === 'cloud') {
      if (this.unsubs[k]) return;
      let ref;
      try { ref = this.db.doc('life/' + k); } catch (e) { console.error(e); return; }
      this.unsubs[k] = ref.onSnapshot(snap => {
        if (!this.pending[k] && !this.writing[k]) {
          if (snap.exists) this.data[k] = Object.assign(this.fresh(k), clone(snap.data()));
          else if (!this.loaded[k]) this.data[k] = this.fresh(k);
        }
        if (!snap.metadata || !snap.metadata.fromCache) this.markLoaded(k);
        scheduleRender();
      }, err => { this.unsubs[k] = null; this.onError(err, k, true); });
    } else if (this.mode === 'local' || this.mode === 'memory') {
      if (this.mode === 'local') {
        try { const raw = localStorage.getItem(LS + 'doc.' + k); if (raw) this.data[k] = Object.assign(this.fresh(k), JSON.parse(raw)); } catch (e) { /* keep defaults */ }
      }
      this.markLoaded(k);
    }
  },
  save(k) {
    if (!this.loaded[k]) { toast('Still opening your data. Try that again in a moment.', { kind: 'warn' }); return false; }
    if (this.readOnly) { toast('This copy is read-only.', { kind: 'warn' }); return false; }
    this.pending[k] = true; this.setStatus('saving');
    clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(() => this.flush(k), 450);
    return true;
  },
  async flush(k) {
    clearTimeout(this.timers[k]);
    if (!this.pending[k] && !this.again[k]) return;
    if (this.writing[k]) { this.again[k] = true; return; }
    this.writing[k] = true;
    try {
      do {
        this.again[k] = false;
        const body = clone(this.data[k]);
        if (this.mode === 'cloud') await this.writeCloud(k, body);
        else if (this.mode === 'local') {
          try { localStorage.setItem(LS + 'doc.' + k, JSON.stringify(body)); }
          catch (e) { this.mode = 'memory'; toast('This browser stopped storing data, so changes now last only until you close the page.', { kind: 'warn', ms: 7000 }); }
        }
      } while (this.again[k]);
      this.pending[k] = false;
    } catch (err) {
      this.onError(err, k);
    } finally {
      this.writing[k] = false;
      this.refreshStatus();
    }
  },
  async writeCloud(k, body) {
    const ref = this.db.doc('life/' + k);
    try { await ref.set(body); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(600 + Math.random() * 900); await ref.set(body); }
      else throw e;
    }
  },
  flushAll() { Object.keys(this.pending).forEach(k => { if (this.pending[k]) this.flush(k); }); },
  setStatus(s) { if (this.status === s) return; this.status = s; paintSync(); },
  refreshStatus() {
    const busy = Object.keys(this.pending).some(k => this.pending[k]) || Object.keys(this.writing).some(k => this.writing[k]);
    if (this.status === 'error' && !busy) return paintSync();
    this.setStatus(busy ? 'saving' : 'saved');
  },
  onError(err, k, fromListener) {
    const code = err && err.code;
    console.warn('Store error', k, err);
    if (code === 'invalid_argument' && !fromListener && this.mode === 'cloud') {
      this.status = 'error'; paintSync();
      toast('This account can’t save to this daybook. Changes stay on screen only.', { kind: 'bad', ms: 8000 });
      return;
    }
    this.status = 'error'; paintSync();
    if (code === 'quota_exceeded') toast('Your daybook storage is full. Export a backup in Settings, then delete old notes or entries.', { kind: 'bad', ms: 9000 });
    else if (code === 'revoked') toast('This page lost access to its saved data. Reload to reconnect.', { kind: 'bad', ms: 9000 });
    else if (code === 'resource_exhausted') toast('Saving too quickly. Your change is kept and will save with your next edit.', { kind: 'warn' });
    else if (fromListener) toast('Live updates paused. Reload the page to reconnect.', { kind: 'warn', ms: 7000 });
    else toast('Saving failed. Your change is kept on screen and will retry with your next edit.', { kind: 'warn', ms: 6000 });
  },
  async init() {
    let db = null, user = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        [db, user] = await Promise.all([
          window.claude.use('db').catch(() => null),
          window.claude.use('user').catch(() => null)
        ]);
      }
    } catch (e) { db = null; }
    let owner = !!db;
    if (db && user) { try { owner = await user.isOwner(); } catch (e) { owner = true; } }
    if (this.mode !== 'loading') return; // switched to device mode while waiting
    if (db && owner) { this.mode = 'cloud'; this.db = db; }
    else { this.why = db ? 'shared' : 'offline'; this.mode = lsOK() ? 'local' : 'memory'; }
    this.startWatching();
  },
  startWatching() {
    const y = new Date().getFullYear();
    const keys = new Set([...CORE_KEYS, 'money-' + y, 'journal-' + y, ...Object.keys(this.data)]);
    keys.forEach(k => { if (!this.data[k]) this.data[k] = this.fresh(k); this.watch(k); });
    Promise.all(CORE_KEYS.map(k => this.whenLoaded(k))).then(() => {
      this.ready = true;
      if (!ui.cal.cursor) ui.cal.cursor = todayKey();
      render();
    });
  },
  switchToDevice() {
    Object.values(this.unsubs).forEach(u => { try { u && u(); } catch (e) { /* ignore */ } });
    this.unsubs = {}; this.data = {}; this.loaded = {}; this.pending = {}; this.writing = {};
    this.mode = lsOK() ? 'local' : 'memory'; this.why = 'manual';
    this.startWatching();
  }
};

/* ---------- toasts ---------- */

  const host = $('#toasts'); if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (o.kind || '');
  el.setAttribute('role', 'status');
  const span = document.createElement('span'); span.textContent = msg; el.append(span);
  if (o.action) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = o.action;
    b.addEventListener('click', () => { try { o.onAction && o.onAction(); } finally { el.remove(); } });
    el.append(b);
  }
  host.append(el);
  while (host.children.length > 3) host.firstChild.remove();
  setTimeout(() => el.remove(), o.ms || 5000);

function captureFocus() {
  const a = document.activeElement;

  return info;
}

}

/* Half-filled forms (add habit, log workout…) keep their typed values when the page redraws. */
function draftKey(el) {
  if (el.type === 'submit' || el.type === 'file' || el.type === 'hidden') return null;
  if (el.id) return '#' + el.id;
  const f = el.form; if (!f || !el.name) return null;
  return [f.dataset.submit, f.dataset.id || f.dataset.g || f.dataset.qa || '', el.name, el.type === 'checkbox' || el.type === 'radio' ? el.value : ''].join('|');
}
function captureDrafts() {
  const out = {};
  $$('#main form[data-submit] input, #main form[data-submit] textarea, #main form[data-submit] select').forEach(el => {
    const k = draftKey(el); if (!k) return;
    const dirty = (el.type === 'checkbox' || el.type === 'radio') ? el.checked !== el.defaultChecked : el.tagName === 'SELECT' ? true : el.value !== el.defaultValue;
    if (dirty) out[k] = (el.type === 'checkbox' || el.type === 'radio') ? { c: el.checked } : { v: el.value };

}

  $$('#main form[data-submit] input, #main form[data-submit] textarea, #main form[data-submit] select').forEach(el => {
    const k = draftKey(el); if (!k || !(k in d)) return;
    if ('c' in d[k]) el.checked = d[k].c; else if (el.value !== d[k].v) { el.value = d[k].v; if (el.dataset.input === 'qaPreview') INPUTS.qaPreview(el); }

  }

  const list = areas();

  return list.find(a => norm(a.id) === t) || list.find(a => norm(a.name) === t) ||
    list.find(a => norm(a.name).startsWith(t)) || list.find(a => norm(a.id).startsWith(t)) || null;

    take(/\s(tomorrow|tmr|tmrw|tml|tmw)(?=\s)/i, () => { out.due = addDays(tk, 1); });

}

/* =====================================================================

function tasks() { return Store.get('tasks').items; }

    important: false, repeat: 'none', subs: [], est: null, goal: null, focus: null,
    createdAt: new Date().toISOString(), doneAt: null, order: Date.now()

}
function addTask(p) {

  tasks().push(t);
  if (!Store.save('tasks')) { tasks().pop(); return null; }
  return t;
}
function updateTask(id, patch, rerender = true) {
  const t = taskById(id); if (!t) return;

}
function nextDue(k, rep) {

  if (rep === 'weekdays') { let n = addDays(k, 1); while (dow(n) === 0 || dow(n) === 6) n = addDays(n, 1); return n; }
  if (rep === 'monthly') {
    const d = fromKey(k); const day = d.getDate();
    const t = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(day, last)); return keyOf(t);
  }

}

  if (t.repeat && t.repeat !== 'none') {
    const tk = todayKey();
    let nd = nextDue(t.due || tk, t.repeat);
    let guard = 0;
    while (nd <= tk && guard++ < 400) nd = nextDue(nd, t.repeat);
    const copy = newTask(Object.assign(clone(t), {
      id: uid('t'), status: 'todo', doneAt: null, due: nd, focus: null, spawned: null,
      subs: (t.subs || []).map(s => ({ ...s, d: false })), createdAt: new Date().toISOString(), order: Date.now()
    }));

  }

}
function reopenTask(t) {

    const c = taskById(t.spawned);
    if (c && !isDone(c)) { const items = tasks(); items.splice(items.indexOf(c), 1); }
    t.repeat = t.wasRepeat || 'none'; delete t.spawned; delete t.wasRepeat;
  }
}
function toggleTask(id) {

  if (isDone(t)) { reopenTask(t); Store.save('tasks'); scheduleRender(); return; }
  const copy = completeTask(t);
  Store.save('tasks'); scheduleRender();
  toast(copy ? `Done. Next one is due ${dueWords(copy.due)}.` : `Done: ${t.title}`, {
    action: 'Undo', onAction: () => { const x = taskById(id); if (x) { reopenTask(x); Store.save('tasks'); scheduleRender(); } }

function setTaskStatus(id, st) {

function smartSort(a, b) {

  if (t.repeat && t.repeat !== 'none') parts.push(`<span class="meta">${icon('repeat')}${esc((REPEAT.find(r => r.id === t.repeat) || {}).short || '')}</span>`);
  if (t.status === 'doing') parts.push('<span class="meta st">Doing</span>');

  if (subsN) parts.push(`<span class="meta">${icon('list')}${subsD}/${subsN}</span>`);

function exampleCount() {
  if (!Store.ready) return 0;
  let n = 0;
  const cnt = arr => (arr || []).filter(x => x && x.ex).length;
  n += cnt(tasks()) + cnt(events()) + cnt(habitsDoc().items) + cnt(goalsDoc().items) + cnt(Store.get('notes').items);
  const mm = Store.get('moneymeta'); n += cnt(mm.bills) + cnt(mm.collect);
  const fit = Store.get('fitness'); n += cnt(fit.workouts) + cnt(fit.weights);
  Object.keys(Store.data).forEach(k => {
    if (/^money-\d{4}$/.test(k)) n += cnt(Store.data[k].items);
    if (/^journal-\d{4}$/.test(k)) n += Object.values(Store.data[k].entries || {}).filter(e => e && e.ex).length;
  });
  return n;
}
function exampleBanner() {

function todaySummary(o) {
  const bits = [];
  if (o.overdue) bits.push(`${plural(o.overdue, 'overdue task')}`);
  bits.push(o.due ? `${plural(o.due, 'task')} due today` : (o.overdue ? 'nothing else due today' : 'nothing due today'));
  if (o.events) bits.push(plural(o.events, 'event'));
  if (o.habits) bits.push(`${o.habDone} of ${o.habits} habits done`);
  let s = bits.length > 1 ? bits.slice(0, -1).join(', ') + ' and ' + bits[bits.length - 1] : bits[0];
  return cap(s) + '.';
}

const CAL_H0 = 6, CAL_H1 = 23, HOUR_PX = 44;
function events() { return Store.get('events').items; }
function eventById(id) { return events().find(e => e.id === id) || null; }
function eventOccurs(e, k) {
  if (!e.date || k < e.date) return false;
  if (e.until && k > e.until) return false;
  if ((e.skip || []).includes(k)) return false;
  switch (e.repeat) {
    case 'daily': return true;
    case 'weekdays': { const w = dow(k); return w >= 1 && w <= 5; }
    case 'weekly': return dow(k) === dow(e.date);
    case 'monthly': return fromKey(k).getDate() === fromKey(e.date).getDate();
    default: return k === e.date;
  }
}
function eventsOn(k) {
  return events().filter(e => eventOccurs(e, k)).sort((a, b) => ((a.start || '') < (b.start || '') ? -1 : (a.start || '') > (b.start || '') ? 1 : 0));
}
function layoutDay(evs) {
  const timed = evs.filter(e => e.start).map(e => {
    const s = hmToMin(e.start); let en = e.end ? hmToMin(e.end) : s + 60; if (en <= s) en = s + 30;
    return { e, s, en };
  }).sort((a, b) => a.s - b.s || b.en - a.en);
  const out = []; let cluster = [], clusterEnd = -1;
  const flush = () => {
    const cols = [];
    cluster.forEach(it => { let c = cols.findIndex(end => end <= it.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = it.en; it.col = c; });
    cluster.forEach(it => { it.ncol = cols.length; out.push(it); });
    cluster = []; clusterEnd = -1;
  };
  timed.forEach(it => { if (cluster.length && it.s >= clusterEnd) flush(); cluster.push(it); clusterEnd = Math.max(clusterEnd, it.en); });
  if (cluster.length) flush();
  return out;
}

function niceMax(v) {

function htmlBars({ labels, series, fmt = v => String(Math.round(v)), h = 170, hi = -1 }) {

  const ticks = [0, 0.25, 0.5, 0.75, 1];
  return `<div class="hbars" style="--h:${h}px">
    <div class="hb-y">${ticks.slice().reverse().map(t => `<span>${esc(fmt(max * t))}</span>`).join('')}</div>
    <div class="hb-plot">${ticks.map(t => `<i class="hb-grid" style="bottom:${t * 100}%"></i>`).join('')}
      ${labels.map((lb, i) => `<div class="hb-g ${i === hi ? 'hi' : ''}">${series.map(s => {
        const v = Number(s.values[i]) || 0;
        return `<b class="hb-bar ${s.cls}" style="height:${(v / max * 100).toFixed(2)}%" title="${esc(lb + ' · ' + s.name + ': ' + fmt(v))}"></b>`;
      }).join('')}</div>`).join('')}
    </div>
    <div class="hb-x">${labels.map((lb, i) => `<span class="${i === hi ? 'hi' : ''}">${esc(lb)}</span>`).join('')}</div>
  </div>`;
}
function sparkline(points, { h = 96, fmt = v => String(v) } = {}) {
  if (points.length < 2) return '';
  const ys = points.map(p => p.y); const mn = Math.min(...ys), mx = Math.max(...ys);
  const span = (mx - mn) || 1; const lo = mn - span * 0.2, hi = mx + span * 0.2;
  const t0 = points[0].x, t1 = points[points.length - 1].x; const tot = Math.max(1, diffDays(t1, t0));
  const xp = p => (diffDays(p.x, t0) / tot) * 100; const yp = v => (1 - (v - lo) / (hi - lo)) * 100;
  const d = points.map((p, i) => (i ? 'L' : 'M') + xp(p).toFixed(2) + ' ' + yp(p.y).toFixed(2)).join(' ');
  const last = points[points.length - 1];
  return `<div class="spark" style="height:${h}px"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="sa" d="${d} L100 100 L0 100 Z"/><path class="sl" d="${d}"/></svg>
    <i class="sd" style="left:${xp(last)}%;top:${yp(last.y)}%"></i>
    <span class="lab" style="top:${yp(mx)}%;transform:translateY(-50%)">${esc(fmt(mx))}</span>
    <span class="lab" style="top:${yp(mn)}%;transform:translateY(-50%)">${esc(fmt(mn))}</span></div>`;
}

function journalKey(k) { return 'journal-' + String(k).slice(0, 4); }
function blankEntry() { return { mood: null, energy: null, grat: ['', '', ''], wins: '', text: '', intent: '' }; }
function entryFor(k, create = false) {
  const doc = Store.get(journalKey(k)); if (!doc.entries) doc.entries = {};
  let e = doc.entries[k];
  if (!e && create) e = doc.entries[k] = blankEntry();
  if (e && !Array.isArray(e.grat)) e.grat = ['', '', ''];
  return e || null;
}
function entryHasContent(e) {
  return !!e && !!(e.mood || e.energy || (e.grat || []).some(x => x && x.trim()) || (e.wins || '').trim() || (e.text || '').trim() || (e.intent || '').trim());
}
function journalStreak() {
  const tk = todayKey(); let k = tk; let n = 0;
  if (!entryHasContent(entryFor(tk))) k = addDays(tk, -1);
  for (let i = 0; i < 800; i++) {
    if (!Store.loaded[journalKey(k)]) { Store.get(journalKey(k)); break; }
    if (entryHasContent(entryFor(k))) n++; else break;
    k = addDays(k, -1);
  }
  return n;
}

function notes() { return Store.get('notes').items; }
function noteById(id) { return notes().find(n => n.id === id) || null; }
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
}
function md(src) {
  const lines = esc(src || '').split('\n'); let html = ''; let list = null; let para = [];
  const flushPara = () => { if (para.length) { html += '<p>' + mdInline(para.join('<br>')) + '</p>'; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  lines.forEach(line => {
    let m;
    if (!line.trim()) { flushPara(); closeList(); return; }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flushPara(); closeList(); html += (m[1].length === 1 ? '<h4>' : '<h5>') + mdInline(m[2]) + (m[1].length === 1 ? '</h4>' : '</h5>'); return; }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { flushPara(); closeList(); html += '<blockquote>' + mdInline(m[1]) + '</blockquote>'; return; }
    if ((m = line.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))) { flushPara(); if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } const d = m[1].toLowerCase() === 'x'; html += `<li class="task ${d ? 'done' : ''}">${d ? '☑' : '☐'}<span>${mdInline(m[2])}</span></li>`; return; }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flushPara(); if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += '<li>' + mdInline(m[1]) + '</li>'; return; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += '<li>' + mdInline(m[1]) + '</li>'; return; }
    closeList(); para.push(line);
  });
  flushPara(); closeList();
  return html || '<p class="faint">Nothing written yet.</p>';
}

function weekStats(ws) {
  const we = addDays(ws, 6); const tk = todayKey(); const lastDay = we < tk ? we : tk;
  const inR = k => k && k >= ws && k <= we;
  const done = tasks().filter(t => isDone(t) && inR(doneKey(t)));
  const byArea = {}; done.forEach(t => { const k = t.area || 'none'; byArea[k] = (byArea[k] || 0) + 1; });
  let sch = 0, hd = 0;
  activeHabits().forEach(h => { for (let k = ws; k <= lastDay; k = addDays(k, 1)) { if (scheduledOn(h, k)) { sch++; if (habitDone(h.id, k)) hd++; } } });
  const focusMins = sum(Store.get('focus').sessions.filter(s => inR(s.date)).map(s => s.mins));
  const wos = workoutsBetween(ws, we);
  const tx = txnsBetween(ws, we);
  const inc = sum(tx.filter(t => t.type === 'in').map(t => t.amount)); const out = sum(tx.filter(t => t.type === 'out').map(t => t.amount));
  const moods = rangeKeys(ws, 7).map(k => entryFor(k)).filter(e => e && e.mood).map(e => e.mood);
  const nextWs = addDays(ws, 7);
  const nextDue = tasks().filter(t => !isDone(t) && t.due && t.due >= nextWs && t.due <= addDays(nextWs, 6)).length;
  const nextEvents = sum(rangeKeys(nextWs, 7).map(k => eventsOn(k).length));
  const overdue = tasks().filter(t => !isDone(t) && t.due && t.due < tk).length;
  const inbox = tasks().filter(t => !isDone(t) && !t.area && !t.due).length;
  return { done, byArea, habitPct: sch ? hd / sch : null, focusMins, wos, inc, out, net: inc - out, mood: moods.length ? sum(moods) / moods.length : null, nextDue, nextEvents, overdue, inbox };
}

async function allDocs() {

  for (let i = 0; i < 3; i++) { keys.add('money-' + (y - i)); keys.add('journal-' + (y - i)); }
  await Promise.all([...keys].map(k => Promise.race([Store.whenLoaded(k), sleep(6000)])));
  const docs = {};
  keys.forEach(k => {
    const d = Store.data[k]; if (!d || !Store.loaded[k]) return;
